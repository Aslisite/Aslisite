<rect x="24" y="180" width="340" height="90" rx="20" fill="#EEF2FF"/>
<text x="60" y="235" font-size="32" font-family="Arial" fill="#3B4CCA">Dashboard</text>

<text x="60" y="350" font-size="30" font-family="Arial" fill="#667085">Invoices</text>
